<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">Illustrative on-grid solar system</title><desc id="desc">Solar panels connect through an inverter to a home and the electricity grid. A standard on-grid system does not provide backup during a grid outage.</desc><rect width="900" height="360" rx="24" fill="#f3f6ef"/><g fill="none" stroke="#254c3a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M105 150 205 75l100 75v130H105z"/><path d="M150 280v-78h50v78"/><path d="M128 147h154"/><path d="M137 115h125"/><path d="M420 115h120v115H420z"/><path d="M450 145h60m-60 28h60m-60 28h35"/><path d="M305 190h115m120 0h120m105 0h60"/><path d="m390 178 20 12-20 12m145-24 20 12-20 12m145-24 20 12-20 12"/></g><g fill="#b8d4a0" stroke="#254c3a" stroke-width="4"><path d="m120 142 85-64 85 64-12 17H132z"/><rect x="615" y="105" width="95" height="160" rx="12" fill="#fff"/><path d="M630 145h65M630 165h65M630 185h65" fill="none"/></g><g fill="#254c3a" font-family="Arial,sans-serif" font-size="22" font-weight="700"><text x="205" y="325" text-anchor="middle">Solar panels</text><text x="480" y="285" text-anchor="middle">Inverter</text><text x="662" y="300" text-anchor="middle">Electricity grid</text></g><g fill="#6b786d" font-family="Arial,sans-serif" font-size="16"><text x="205" y="345" text-anchor="middle">Generate electricity</text><text x="480" y="310" text-anchor="middle">Convert power</text><text x="662" y="325" text-anchor="middle">Grid supply / export</text></g></svg>