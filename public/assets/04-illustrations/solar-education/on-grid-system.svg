<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="title desc"><title id="title">On-grid solar system</title><desc id="desc">Original Green Grid educational illustration; technical review required before publication.</desc><rect width="320" height="180" rx="16" fill="#f5f7f4"/><rect x="10" y="24" width="78" height="42" rx="8" fill="#fff" stroke="#14532d" stroke-width="2"/><text x="49" y="50" font-family="Arial" font-size="12" fill="#173b2b" text-anchor="middle">Solar panels</text><path d="M88 45 H110 m0 -5 l8 5 -8 5" fill="none" stroke="#84cc16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="118" y="24" width="78" height="42" rx="8" fill="#fff" stroke="#14532d" stroke-width="2"/><text x="157" y="50" font-family="Arial" font-size="12" fill="#173b2b" text-anchor="middle">Inverter</text><path d="M196 45 H218 m0 -5 l8 5 -8 5" fill="none" stroke="#84cc16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="226" y="24" width="84" height="42" rx="8" fill="#fff" stroke="#14532d" stroke-width="2"/><text x="268" y="50" font-family="Arial" font-size="12" fill="#173b2b" text-anchor="middle">Home loads</text><rect x="118" y="112" width="78" height="42" rx="8" fill="#fff" stroke="#14532d" stroke-width="2"/><text x="157" y="138" font-family="Arial" font-size="12" fill="#173b2b" text-anchor="middle">Utility grid</text><path d="M157 66V112" stroke="#14532d" stroke-width="2" stroke-dasharray="4 4"/><text x="160" y="91" text-anchor="middle" font-size="10" fill="#173b2b">Grid connection</text><text x="160" y="166" text-anchor="middle" font-size="10" fill="#173b2b">Grid-tied systems generally shut down during outages unless designed otherwise.</text></svg>